# Optional infra for persistence/replay (not required for the dev walking skeleton).
# `docker compose up -d` to enable, then point the gateway at it in a future
# persistence layer. PostGIS stores entity tracks; Redis fans out live diffs
# across multiple gateway instances.
services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: osint
      POSTGRES_PASSWORD: osint
      POSTGRES_DB: osint
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
